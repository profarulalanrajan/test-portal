<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tests</title>
<script src="config.js"></script>
<style>
  :root {
    --indigo: #312e81; --indigo-2: #4338ca; --indigo-soft: #eef0fb;
    --teal: #0f766e; --teal-soft: #e6f4f2;
    --amber: #b45309; --amber-soft: #fdf3e2;
    --red: #b42318; --red-soft: #fdecea;
    --ink: #1f2330; --muted: #5b6070; --line: #dfe2ea;
    --serif: Cambria, "Cambria Math", Georgia, "Times New Roman", serif;
    --sans: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink); }
  body { font-family: var(--sans); font-size: 17px; line-height: 1.55; }
  .hidden { display: none !important; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 16px 72px; }

  header { border-bottom: 3px solid var(--indigo); padding-bottom: 18px; margin-bottom: 26px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); font-weight: 700; }
  .home { font-size: 14px; color: var(--muted); text-decoration: none; }
  .home:hover { color: var(--indigo); }
  h1 { font-family: var(--serif); font-size: 40px; line-height: 1.15; margin: 6px 0 6px; color: var(--indigo); }
  .lead { color: var(--muted); margin: 0; max-width: 620px; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; }
  .chip { font: inherit; font-size: 14px; font-weight: 700; padding: 6px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid #c9cdd8; background: #fff; color: var(--muted); }
  .chip:hover { border-color: var(--indigo); color: var(--indigo); }
  .chip.on { background: var(--indigo); border-color: var(--indigo); color: #fff; }

  h2 { font-family: var(--serif); font-size: 22px; color: var(--indigo); margin: 30px 0 12px; display: flex; align-items: center; gap: 10px; }
  h2 .count { font-family: var(--sans); font-size: 13px; font-weight: 700; color: var(--muted); background: var(--indigo-soft);
    border-radius: 999px; padding: 1px 9px; }
  .list { display: grid; gap: 12px; }

  .card { display: grid; grid-template-columns: 1fr auto; gap: 6px 20px; align-items: center; text-decoration: none; color: inherit;
    border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px; padding: 16px 18px; background: #fff; }
  a.card:hover { border-color: #b7bbcc; border-left-color: var(--indigo); box-shadow: 0 4px 14px rgba(31,35,48,.06); }
  .card.open { border-left-color: var(--teal); }
  .card.upcoming { border-left-color: var(--amber); }
  .card.closed { background: #fafbfc; }
  .course { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--teal); font-weight: 700; }
  .card.closed .course { color: var(--muted); }
  .title { font-family: var(--serif); font-size: 21px; color: var(--indigo); line-height: 1.25; margin: 2px 0 2px; }
  .card.closed .title { color: var(--ink); }
  .topics { color: var(--muted); font-size: 15px; }
  .facts { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .facts b { color: var(--ink); font-weight: 700; }
  .side { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .badge { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 4px; padding: 3px 8px; white-space: nowrap; }
  .badge.open { background: var(--teal-soft); color: var(--teal); }
  .badge.upcoming { background: var(--amber-soft); color: var(--amber); }
  .badge.closed { background: #eef0f3; color: var(--muted); }
  .go { font-weight: 700; font-size: 15px; color: #fff; background: var(--indigo); border-radius: 6px; padding: 8px 16px; white-space: nowrap; }
  a.card:hover .go { background: var(--indigo-2); }
  .when { font-size: 13px; color: var(--muted); white-space: nowrap; }

  .empty, .status { color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 22px; text-align: center; }
  .status.err { color: var(--red); background: var(--red-soft); border: none; }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }

  @media (max-width: 600px) {
    h1 { font-size: 32px; }
    .card { grid-template-columns: 1fr; }
    .side { flex-direction: row; justify-content: space-between; align-items: center; text-align: left; margin-top: 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="eyebrow" id="owner"></div>
      <a class="home hidden" id="home">&larr; Courses &amp; slides</a>
    </div>
    <h1>Tests</h1>
    <p class="lead">Open a test when your instructor tells you to. You will need the access code announced in class.</p>
  </header>

  <div class="filters hidden" id="filters"></div>

  <div id="status" class="status">Loading tests…</div>

  <section id="sec-open" class="hidden">
    <h2>Open now <span class="count" id="n-open"></span></h2>
    <div class="list" id="list-open"></div>
  </section>
  <section id="sec-upcoming" class="hidden">
    <h2>Upcoming <span class="count" id="n-upcoming"></span></h2>
    <div class="list" id="list-upcoming"></div>
  </section>
  <section id="sec-closed" class="hidden">
    <h2>Past tests <span class="count" id="n-closed"></span></h2>
    <div class="list" id="list-closed"></div>
  </section>

  <footer>Use a laptop or desktop with Chrome, Edge or Firefox. Tests run in full screen and record when you leave the window.</footer>
</div>

<script>
(function () {
  'use strict';
  var CFG = window.PORTAL_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var TESTS = [], COURSE = 'All';

  if (CFG.OWNER) { $('owner').textContent = CFG.OWNER; document.title = 'Tests · ' + CFG.OWNER; }
  if (CFG.HOME_URL) { $('home').href = CFG.HOME_URL; $('home').classList.remove('hidden'); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function when(ms) {
    return new Date(ms).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function showStatus(msg, err) {
    var s = $('status'); s.textContent = msg; s.className = 'status' + (err ? ' err' : ''); s.classList.remove('hidden');
  }

  function load(attempt) {
    if (!CFG.BACKEND_URL || CFG.BACKEND_URL.indexOf('http') !== 0) {
      return showStatus('The test portal has not been connected to its server yet.', true);
    }
    fetch(CFG.BACKEND_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'list' }), redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.ok) throw new Error((res && (res.detail || res.error)) || 'bad response');
        TESTS = res.tests || [];
        buildFilters();
        render();
      })
      .catch(function (err) {
        if ((attempt || 1) < 3) return setTimeout(function () { load((attempt || 1) + 1); }, 1200 * (attempt || 1));
        if (window.console) console.error('Test list failed:', err);
        showStatus('Could not load the tests. Check your internet connection and reload the page.' +
          (err && err.message && err.message !== 'Failed to fetch' ? ' (' + err.message + ')' : ''), true);
      });
  }

  function buildFilters() {
    var courses = [];
    TESTS.forEach(function (t) { if (t.course && courses.indexOf(t.course) === -1) courses.push(t.course); });
    var f = $('filters');
    f.innerHTML = '';
    if (courses.length < 2) { f.classList.add('hidden'); return; }
    ['All'].concat(courses.sort()).forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'chip' + (c === COURSE ? ' on' : '');
      b.textContent = c;
      b.addEventListener('click', function () { COURSE = c; buildFilters(); render(); });
      f.appendChild(b);
    });
    f.classList.remove('hidden');
  }

  function card(t) {
    var facts = plural(t.count, 'question') + ' · ' + plural(t.totalMarks, 'mark') + ' · ' + plural(t.duration, 'minute');
    var badge = { open: 'Open', upcoming: 'Upcoming', closed: 'Closed' }[t.phase];
    var whenTxt = '';
    if (t.phase === 'open' && t.closesAt) whenTxt = 'Closes ' + when(t.closesAt);
    if (t.phase === 'upcoming' && t.opensAt) whenTxt = 'Opens ' + when(t.opensAt);
    if (t.phase === 'closed' && t.closesAt) whenTxt = 'Closed ' + when(t.closesAt);
    var tag = t.phase === 'closed' ? 'div' : 'a';
    return '<' + tag + ' class="card ' + t.phase + '"' + (tag === 'a' ? ' href="test.html?id=' + encodeURIComponent(t.id) + '"' : '') + '>' +
      '<div>' +
        (t.course ? '<div class="course">' + esc(t.course) + '</div>' : '') +
        '<div class="title">' + esc(t.title) + '</div>' +
        (t.topics ? '<div class="topics">' + esc(t.topics) + '</div>' : '') +
        '<div class="facts">' + facts + '</div>' +
      '</div>' +
      '<div class="side">' +
        '<span class="badge ' + t.phase + '">' + badge + '</span>' +
        (t.phase === 'open' ? '<span class="go">Open test &rarr;</span>' : '') +
        (whenTxt ? '<span class="when">' + whenTxt + '</span>' : '') +
      '</div>' +
    '</' + tag + '>';
  }

  function render() {
    var shown = TESTS.filter(function (t) { return COURSE === 'All' || t.course === COURSE; });
    var groups = { open: [], upcoming: [], closed: [] };
    shown.forEach(function (t) { (groups[t.phase] || groups.closed).push(t); });
    groups.open.sort(function (a, b) { return (a.closesAt || Infinity) - (b.closesAt || Infinity); });
    groups.upcoming.sort(function (a, b) { return (a.opensAt || 0) - (b.opensAt || 0); });
    groups.closed.sort(function (a, b) { return (b.closesAt || 0) - (a.closesAt || 0); });
    ['open', 'upcoming', 'closed'].forEach(function (k) {
      $('list-' + k).innerHTML = groups[k].map(card).join('');
      $('n-' + k).textContent = groups[k].length;
      $('sec-' + k).classList.toggle('hidden', groups[k].length === 0);
    });
    if (!shown.length) showStatus('No tests have been published yet.');
    else $('status').classList.add('hidden');
  }

  load(1);
  // Keep Open / Upcoming / Closed accurate if the page is left open before a test.
  setInterval(function () { if (!document.hidden) load(1); }, 60000);
})();
</script>
</body>
</html>
